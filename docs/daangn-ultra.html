<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ff6f0f">
<link rel="manifest" href="daangn-ultra.webmanifest">
<link rel="icon" href="daangn-ultra-icon-192.png">
<link rel="apple-touch-icon" href="daangn-ultra-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="울트라">
<title>울트라 득템</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#1d1d1f;--sub:#6e6e73;--accent:#ff6f0f;--line:#e5e5e5;--chip:#ececea}
@media (prefers-color-scheme:dark){:root{--bg:#111;--card:#1c1c1e;--ink:#f2f2f2;--sub:#a1a1a6;--line:#2c2c2e;--chip:#2c2c2e}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding-top:env(safe-area-inset-top)}
header{padding:16px 16px 2px} h1{margin:0;font-size:20px} .sub{color:var(--sub);font-size:12px;margin-top:4px;line-height:1.5}
.bar{position:sticky;top:0;z-index:1;background:var(--bg);padding:8px 12px 6px}
.tabs,.chips{display:flex;gap:6px}
.tabs{overflow-x:auto;scrollbar-width:none} .tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;border:0;border-radius:999px;padding:9px 12px;font-size:14px;white-space:nowrap;font-weight:600;background:var(--chip);color:var(--ink);font-family:inherit}
.tabs button.on{background:var(--accent);color:#fff}
.chips{margin-top:8px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;font-family:inherit}
.chips button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.ctrl{display:flex;gap:6px;margin-top:8px}
.ctrl select{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 6px;font-size:13px;font-family:inherit}
.list{padding:4px 12px 40px;display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;color:inherit;text-decoration:none}
.card img{width:88px;height:88px;border-radius:10px;object-fit:cover;flex:none;background:var(--line)}
.info{min-width:0;display:flex;flex-direction:column;gap:3px} .top{font-size:15px}
.new{background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:6px}
.price{font-size:17px;font-weight:700} .off{font-size:12px;font-weight:500;color:var(--accent);margin-left:4px} .off.up{color:var(--sub)}
.meta{font-size:12px;color:var(--sub)} .title{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--sub);padding:40px 0}
[hidden]{display:none!important}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.reload{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:14px;font-family:inherit}
</style></head><body>
<header><div class="head"><h1>📱 갤럭시 울트라</h1>
<button class="reload" onclick="reloadNow()">↻ 새로고침</button></div>
<div class="sub">서울·남양주·하남·구리는 가격 상관없이 전부(파손 포함) · 그 밖 전국은 바로구매되는 것 전부<br>마지막 확인 10월 30일 07:27 · 15분마다 자동 갱신 · 시세 2026-10-26 · 누르면 당근 앱으로 · NEW = 3시간 안에 새로 잡힌 매물</div></header>
<div class="bar">
<nav class="tabs"><button data-b="전체">전체 0</button><button data-b="서울권">서울권 0</button><button data-b="전국">전국 바로구매 0</button></nav>
<nav class="chips" hidden><button data-c="전체">전체</button><button data-c="S26">S26</button><button data-c="S25">S25</button><button data-c="S24">S24</button><button data-c="S23">S23</button><button data-c="S22">S22</button><button data-c="S21">S21</button><button data-c="S20">S20</button></nav>
<div class="ctrl">
  <select id="sido" aria-label="시·도"></select>
  <select id="sgg" aria-label="시·군·구" hidden></select>
  <select id="sort" aria-label="정렬">
    <option value="disc">할인율 높은순</option><option value="new">최신순</option>
    <option value="low">가격 낮은순</option><option value="high">가격 높은순</option>
  </select>
</div>
</div>
<div class="list"><p class="empty" hidden>지금은 기준가 이하 매물이 없어요.</p></div>
<script>
var cards = document.querySelectorAll('a.card'), empty = document.querySelector('.empty');
var chipBar = document.querySelector('.chips'), SUB = {"전체|전체": 0, "전체|S26": 0, "전체|S25": 0, "전체|S24": 0, "전체|S23": 0, "전체|S22": 0, "전체|S21": 0, "전체|S20": 0, "서울권|전체": 0, "서울권|S26": 0, "서울권|S25": 0, "서울권|S24": 0, "서울권|S23": 0, "서울권|S22": 0, "서울권|S21": 0, "서울권|S20": 0, "전국|전체": 0, "전국|S26": 0, "전국|S25": 0, "전국|S24": 0, "전국|S23": 0, "전국|S22": 0, "전국|S21": 0, "전국|S20": 0}, CHIP_TABS = ["전체", "서울권", "전국"];
var STORE = 'dg-ultra-filter';
var st = {b: '전체', c: '전체', sido: '전국', sgg: '전체', sort: 'new'};
var list = document.querySelector('.list'), selSido = document.getElementById('sido'),
    selSgg = document.getElementById('sgg'), selSort = document.getElementById('sort');
function opts(sel, items, cur) {
  sel.innerHTML = items.map(function (x) { return '<option value="' + x[0] + '"' + (x[0] === cur ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('');
}
function countBy(key, pred) {
  var m = {};
  cards.forEach(function (c) { if (pred(c)) m[c.dataset[key]] = (m[c.dataset[key]] || 0) + 1; });
  return Object.keys(m).sort(function (a, b) { return m[b] - m[a]; }).map(function (k) { return [k, k + ' ' + m[k]]; });
}
try { Object.assign(st, JSON.parse(localStorage.getItem(STORE)) || {}); } catch (e) {}
function render() {
  if (!document.querySelector('.tabs button[data-b="' + st.b + '"]')) st.b = '전체';   // 없어진 탭이 저장돼 있으면
  var withChips = CHIP_TABS.indexOf(st.b) >= 0;
  if (!withChips) st.c = '전체';
  chipBar.hidden = !withChips;
  document.querySelectorAll('.chips button').forEach(function (b) {
    var n = b.dataset.c === '전체' ? '' : ' ' + (SUB[st.b + '|' + b.dataset.c] || 0);
    b.textContent = b.dataset.c + n;
    b.classList.toggle('on', b.dataset.c === st.c);
  });
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.classList.toggle('on', b.dataset.b === st.b);
    if (b.dataset.b === st.b && b.scrollIntoView) b.scrollIntoView({inline: 'center', block: 'nearest'});   // 고른 탭이 화면 밖이면 보이게
  });
  var kind = function (c) { return (st.b === '전체' || c.dataset.brand === st.b) && (st.c === '전체' || c.dataset.cat === st.c); };
  // 지역: 지금 고른 종류 안에서 시·도별 개수 → 시·도를 고르면 그 안의 시·군·구
  var sidos = countBy('sido', kind);
  if (st.sido !== '전국' && !sidos.some(function (x) { return x[0] === st.sido; })) st.sido = '전국';
  opts(selSido, [['전국', '전국 ' + cards.length]].concat(sidos), st.sido);
  selSido.options[0].text = '전국 ' + sidos.reduce(function (t, x) { return t + +x[1].split(' ').pop(); }, 0);
  if (st.sido === '전국') { st.sgg = '전체'; selSgg.hidden = true; }
  else {
    var sggs = countBy('sgg', function (c) { return kind(c) && c.dataset.sido === st.sido; });
    if (st.sgg !== '전체' && !sggs.some(function (x) { return x[0] === st.sgg; })) st.sgg = '전체';
    opts(selSgg, [['전체', st.sido + ' 전체']].concat(sggs), st.sgg);
    selSgg.hidden = false;
  }
  selSort.value = st.sort;
  var key = {disc: function (c) { return -c.dataset.disc; }, new: function (c) { return -c.dataset.created; },
             low: function (c) { return +c.dataset.price; }, high: function (c) { return -c.dataset.price; }}[st.sort];
  Array.prototype.slice.call(cards).sort(function (a, b) { return key(a) - key(b); })
    .forEach(function (c) { list.insertBefore(c, empty); });
  var n = 0;
  cards.forEach(function (c) {
    var on = kind(c) && (st.sido === '전국' || c.dataset.sido === st.sido) && (st.sgg === '전체' || c.dataset.sgg === st.sgg);
    c.hidden = !on; if (on) n++;
  });
  empty.hidden = n > 0;
  try { localStorage.setItem(STORE, JSON.stringify(st)); } catch (e) {}
}
document.querySelectorAll('.tabs button').forEach(function (b) { b.onclick = function () { st.b = b.dataset.b; st.c = '전체'; render(); }; });
document.querySelectorAll('.chips button').forEach(function (b) { b.onclick = function () { st.c = b.dataset.c; render(); }; });
selSido.onchange = function () { st.sido = selSido.value; st.sgg = '전체'; render(); };
selSgg.onchange = function () { st.sgg = selSgg.value; render(); };
selSort.onchange = function () { st.sort = selSort.value; render(); };
render();
function reloadNow() { location.replace(location.pathname + '?t=' + Date.now()); }
// 앱으로 깔았을 때: 다시 열면(10분 넘게 지났으면) 알아서 최신으로
var loadedAt = Date.now();
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && Date.now() - loadedAt > 10 * 60 * 1000) reloadNow();
});
// 두 창은 완전히 따로 (2026-10-26 대표): 오프라인 도우미도 각자 자기 창만 맡는다
if ('serviceWorker' in navigator) navigator.serviceWorker.register('daangn-ultra-sw.js', {scope: './daangn-ultra.html'}).catch(function () {});
// 안드로이드는 intent:// 로 당근 앱(com.towneers.www)을 직접 연다. 앱이 없으면 웹으로.
// 아이폰은 당근이 유니버설 링크를 걸어둔 주소라 그대로 누르면 앱이 열린다.
if (/Android/i.test(navigator.userAgent)) {
  cards.forEach(function (el) {
    var u = el.dataset.url;
    el.href = 'intent://' + u.replace(/^https:\/\//, '') + '#Intent;scheme=https;package=com.towneers.www;S.browser_fallback_url=' + encodeURIComponent(u) + ';end';
  });
}
</script>
</body></html>
