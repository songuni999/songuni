<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>당근 득템 목록</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#1d1d1f;--sub:#6e6e73;--accent:#ff6f0f;--line:#e5e5e5}
@media (prefers-color-scheme:dark){:root{--bg:#111;--card:#1c1c1e;--ink:#f2f2f2;--sub:#a1a1a6;--line:#2c2c2e}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{padding:18px 16px 8px} h1{margin:0;font-size:20px} .sub{color:var(--sub);font-size:13px;margin-top:4px}
.list{padding:8px 12px 40px;display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;color:inherit;text-decoration:none}
.card img{width:88px;height:88px;border-radius:10px;object-fit:cover;flex:none;background:var(--line)}
.info{min-width:0;display:flex;flex-direction:column;gap:3px} .top{font-size:15px}
.new{background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:6px}
.price{font-size:17px;font-weight:700} .off{font-size:12px;font-weight:500;color:var(--accent);margin-left:4px}
.meta{font-size:12px;color:var(--sub)} .title{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--sub);padding:40px 0}
</style></head><body>
<header><h1>🥕 당근 득템 목록</h1>
<div class="sub">아이패드 프로 M4·M5 · 서울권 · 10월 23일 09:38 기준 · 누르면 당근 앱으로 열려요</div></header>
<div class="list"><p class="empty">지금은 기준가 이하 매물이 없어요.</p></div>
<script>
// 안드로이드는 intent:// 로 당근 앱(com.towneers.www)을 직접 연다. 앱이 없으면 웹으로.
// 아이폰은 당근이 유니버설 링크를 걸어둔 주소라 그대로 누르면 앱이 열린다.
if (/Android/i.test(navigator.userAgent)) {
  document.querySelectorAll('a.card').forEach(function (el) {
    var u = el.dataset.url;
    el.href = 'intent://' + u.replace(/^https:\/\//, '') + '#Intent;scheme=https;package=com.towneers.www;S.browser_fallback_url=' + encodeURIComponent(u) + ';end';
  });
}
</script>
</body></html>
