<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2B1D45">
<meta name="description" content="김고양씨와 함께하는 장난감 파티 룰렛. 찰칵이면 통과, 빵! 이면 벌칙!">
<title>김고양씨 빵! 룰렛</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="빵! 룰렛">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head><body>
﻿<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{
  --bg:#2B1D45; --bg2:#3E2C68; --cream:#FFF7EA; --cream2:#FCEFD9; --ink:#3B2A20; --soft:#8C7563;
  --pink:#FF5C8A; --pink2:#C9356A; --yel:#FFD166; --yel2:#D9A520; --mint:#3CCB9A; --mint2:#239170; --sky:#6FB8FF; --sky2:#3F84D1;
  --f:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{color:var(--ink);font-family:var(--f);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,#4B347C 0%,var(--bg) 62%)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border:0;border-radius:18px;background:#fff;color:var(--ink);
  font-size:21px;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .06s;margin:0}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.pri{background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pink2)}
.btn.yel{background:var(--yel);box-shadow:0 5px 0 var(--yel2)}
.btn.mint{background:var(--mint);color:#fff;box-shadow:0 5px 0 var(--mint2)}
.btn.sky{background:var(--sky);color:#fff;box-shadow:0 5px 0 var(--sky2)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
.btn:disabled{opacity:.45}
.btn small{font-size:13px;opacity:.85}
.ibtn{width:52px;height:52px;border:0;border-radius:16px;background:rgba(255,255,255,.14);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;flex:none}
.ibtn:active{transform:scale(.94)}

/* ---------- 처음 화면 ---------- */
#scTitle{align-items:center;padding:calc(var(--safeT) + 14px) 18px calc(var(--safeB) + 12px);color:#fff;overflow:hidden}
#scTitle .topRow{width:100%;display:flex;justify-content:space-between;gap:8px}
.logo{margin:6px 0 0;text-align:center;line-height:1;position:relative}
.logo small{display:block;font-size:22px;color:var(--yel);letter-spacing:1px}
.logo b{display:inline-block;font-weight:400;font-size:clamp(54px,17vw,76px);color:#fff;text-shadow:0 5px 0 var(--pink2),0 0 24px rgba(255,92,138,.45);transform:rotate(-4deg)}
.logo b em{font-style:normal;color:var(--yel);text-shadow:0 5px 0 var(--yel2)}
.heroBox{position:relative;flex:1;min-height:150px;width:100%;display:flex;align-items:center;justify-content:center}
.heroBox img{width:min(78%,330px);filter:drop-shadow(0 8px 0 rgba(0,0,0,.25));animation:bob 2.6s ease-in-out infinite}
.heroBox .balloons{position:absolute;inset:0;pointer-events:none}
.heroBox .balloons i{position:absolute;width:44px;height:54px;border-radius:50% 50% 48% 48%;animation:float 4s ease-in-out infinite}
.heroBox .balloons i:after{content:'';position:absolute;left:50%;top:100%;width:1.5px;height:40px;background:rgba(255,255,255,.5)}
@keyframes bob{50%{transform:translateY(-8px) rotate(-1.5deg)}}
@keyframes float{50%{transform:translateY(-14px)}}
.menu{width:100%;display:grid;gap:12px}
.menu .btn.big{height:74px;font-size:28px;border-radius:22px}
.menu .btn.big small{display:block;font-size:14px}
.menu .btn .col{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.credit{font-family:system-ui,sans-serif;font-size:10px;color:rgba(255,255,255,.45);text-align:center;margin-top:6px}

/* ---------- 파티 설정 ---------- */
#scSetup{background:var(--cream);color:var(--ink)}
.head{display:flex;align-items:center;gap:10px;padding:calc(var(--safeT) + 10px) 14px 10px;background:var(--bg);color:#fff}
.head h2{flex:1;margin:0;font-weight:400;font-size:26px;text-align:center}
.scroll{flex:1;overflow:auto;padding:14px 16px 20px;-webkit-overflow-scrolling:touch}
.sec{background:#fff;border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 4px 0 #F0E2CB}
.sec h3{margin:0 0 10px;font-weight:400;font-size:20px;display:flex;align-items:center;gap:6px}
.sec h3 small{margin-left:auto;font-size:13px;color:var(--soft)}
.pl{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.pl .no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--yel);display:flex;align-items:center;justify-content:center;font-size:15px}
.pl input{flex:1;min-width:0;height:48px;border:2px solid #EADBC4;border-radius:14px;padding:0 12px;font:inherit;font-size:19px;color:var(--ink);background:var(--cream)}
.pl input:focus{outline:none;border-color:var(--pink)}
.pl button{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:#F5E9D6;font-size:20px}
.row2{display:flex;gap:8px}
.row2 .btn{height:48px;font-size:17px}
.stepper{display:flex;align-items:center;gap:12px;justify-content:center}
.stepper button{width:60px;height:60px;border:0;border-radius:18px;background:var(--yel);font-size:32px;box-shadow:0 4px 0 var(--yel2)}
.stepper button:active{transform:translateY(2px)}
.stepper .val{min-width:110px;text-align:center}
.stepper .val b{display:block;font-size:44px;font-weight:400;line-height:1}
.stepper .val small{font-size:14px;color:var(--soft)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:22px;height:22px;border-radius:50%;background:#EADBC4;border:2px solid #CDB89A}
.dots i.on{background:radial-gradient(circle at 35% 35%,#fff 0 18%,var(--pink) 20%);border-color:var(--pink2)}
.opt{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed #EADBC4}
.opt:first-of-type{border-top:0}
.opt span{flex:1;font-size:18px}
.opt span small{display:block;font-size:13px;color:var(--soft)}
.tgl{flex:none;width:60px;height:34px;border:0;border-radius:999px;background:#DCCDB6;position:relative;transition:.2s}
.tgl:after{content:'';position:absolute;left:4px;top:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 3px rgba(0,0,0,.2)}
.tgl.on{background:var(--mint)}
.tgl.on:after{left:30px}
.foot{padding:10px 16px calc(var(--safeB) + 12px);background:var(--cream);border-top:1px solid #F0E2CB}
.foot .btn{height:64px;font-size:26px}

/* ---------- 게임 판 ---------- */
#scPlay{color:#fff}
.hud{display:flex;align-items:center;gap:8px;padding:calc(var(--safeT) + 8px) 12px 6px;z-index:3}
.hud .mid{flex:1;text-align:center;min-width:0}
.hud .mid b{display:block;font-weight:400;font-size:26px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .mid small{display:block;font-size:14px;color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .side{width:52px;text-align:center;font-size:12px;line-height:1.15;color:rgba(255,255,255,.8);flex:none}
.hud .side b{display:block;font-size:18px;font-weight:400;color:var(--yel)}
.stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hint{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:18px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none;padding:0 70px}
#hint .fing{display:inline-block;animation:swipe 1.1s ease-in-out infinite}
@keyframes swipe{0%{transform:translate(-10px,4px) rotate(-12deg)}50%{transform:translate(12px,-4px) rotate(14deg)}100%{transform:translate(-10px,4px) rotate(-12deg)}}
#big{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:84px;line-height:1;pointer-events:none;opacity:0;transform:scale(.3);color:#fff}
#big.on{animation:bigpop 1.2s cubic-bezier(.2,1.6,.4,1) forwards}
#big.bang{color:#FFE14D;text-shadow:0 6px 0 #E0306A,0 0 30px #FF5C8A,0 0 4px #000;font-size:110px}
#big.click{color:#fff;text-shadow:0 5px 0 #6A5A9A}
#big.soft{color:#BFF5E2;text-shadow:0 5px 0 #239170;font-size:76px}
#big.stage{color:var(--yel);text-shadow:0 5px 0 #8A5A00;font-size:54px}
@keyframes bigpop{0%{opacity:0;transform:scale(.3) rotate(-8deg)}18%{opacity:1;transform:scale(1.12) rotate(3deg)}30%{transform:scale(1) rotate(-2deg)}80%{opacity:1}100%{opacity:0;transform:scale(1.05) translateY(-20px)}}
.mc{position:absolute;right:8px;bottom:6px;display:flex;align-items:flex-end;gap:4px;pointer-events:none;z-index:2;max-width:78%}
.mc img{width:72px;height:72px;border-radius:50%;background:#fff;border:3px solid var(--ink);flex:none;order:2}
.mc .bub{order:1;background:#fff;color:var(--ink);font-size:15px;padding:8px 12px;border-radius:16px 16px 4px 16px;box-shadow:0 3px 0 rgba(0,0,0,.2);margin-bottom:40px;opacity:0;transform:translateY(6px) scale(.9);transition:.18s;max-width:220px}
.mc .bub.on{opacity:1;transform:none}
.mc.jump img{animation:jump .7s cubic-bezier(.3,1.8,.5,1)}
.mc.shake img{animation:shk .5s}
.mc.spin img{animation:spn .9s cubic-bezier(.3,1.4,.5,1)}
@keyframes jump{30%{transform:translateY(-34px) scale(1.1)}}
@keyframes shk{20%,60%{transform:translateX(-6px) rotate(-6deg)}40%,80%{transform:translateX(6px) rotate(6deg)}}
@keyframes spn{60%{transform:translateY(-30px) rotate(330deg) scale(1.15)}100%{transform:rotate(360deg)}}
.ctl{padding:6px 14px calc(var(--safeB) + 12px);z-index:3}
.info{display:flex;justify-content:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.info span{background:rgba(0,0,0,.28);border-radius:999px;padding:6px 12px;font-size:16px}
.info span b{font-weight:400;color:var(--yel)}
.info span.up b{color:#8CF5C9}
.items{display:flex;gap:8px;margin-bottom:10px}
.items button{flex:1;height:50px;border:0;border-radius:14px;background:rgba(255,255,255,.13);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;gap:4px;position:relative;line-height:1.05}
.items button em{font-style:normal;font-size:22px}
.items button b{font-weight:400;position:absolute;right:5px;top:3px;font-size:12px;background:var(--yel);color:var(--ink);border-radius:999px;padding:1px 6px}
.items button.arm{background:var(--mint);box-shadow:0 0 0 3px #BFF5E2 inset}
.items button:disabled{opacity:.35}
.mainRow{display:flex;gap:10px}
.trig{position:relative;flex:1;height:92px;border:0;border-radius:26px;background:linear-gradient(#FF7AA0,#F0457A);color:#fff;box-shadow:0 7px 0 var(--pink2);overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none}
.trig span{font-size:30px;position:relative}
.trig small{font-size:14px;opacity:.9;position:relative}
.trig i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.3)}
.trig.hold{transform:translateY(4px);box-shadow:0 3px 0 var(--pink2)}
.trig:disabled{filter:grayscale(.6);opacity:.55}
.bank{flex:none;width:36%;height:92px;border-radius:26px;font-size:19px;flex-direction:column;gap:0;line-height:1.15}
.bank small{font-size:14px}
#bAuto{height:64px;font-size:21px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(10,0,20,.85) 100%);opacity:0}
#splat{position:fixed;inset:0;pointer-events:none;z-index:45;opacity:0;transition:opacity .5s}
#splat.on{opacity:1;transition:none}

/* ---------- 랭킹 ---------- */
#scRank{background:var(--cream);color:var(--ink)}
.tabs{display:flex;gap:8px;margin:12px 16px 0}
.tabs button{flex:1;height:46px;border:0;border-radius:14px;background:#F2E5D0;font-size:17px;line-height:1.05}
.tabs button small{display:block;font-size:11px;opacity:.7}
.tabs button.on{background:var(--pink);color:#fff}
.rkSum{text-align:center;font-size:13px;color:var(--soft);margin:8px 0 0}
.rkList{list-style:none;margin:0;padding:0}
.rkList li{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:8px 10px;margin-bottom:6px;box-shadow:0 3px 0 #F0E2CB}
.rkList li.me{background:#FFF0F5;box-shadow:0 0 0 2px var(--pink) inset}
.rkList .no{width:30px;height:30px;border-radius:50%;background:#F2E5D0;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.rkList .no.m1{background:#FFD54A}.rkList .no.m2{background:#D9DEE6}.rkList .no.m3{background:#F0B37E}
.rkList .nm{flex:1;min-width:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rkList .nm small{font-size:12px;color:var(--pink);margin-left:4px}
.rkList .sc{font-size:20px;color:var(--pink2)}
.rkList .sc small{font-size:12px;color:var(--soft)}
.rkMsg{text-align:center;padding:30px 10px;color:var(--soft);font-size:17px}
.rkLinks{display:flex;justify-content:center;gap:14px;padding:6px 0 calc(var(--safeB) + 10px);font-size:13px}
.rkLinks a,.rkLinks button{color:var(--soft);background:none;border:0;text-decoration:underline;font-size:13px}

/* ---------- 창 ---------- */
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,10,35,.62)}
#modal.light{background:rgba(20,10,35,.12)}
.card{position:relative;width:100%;max-width:380px;max-height:100%;overflow:auto;overflow-x:hidden;background:var(--cream);color:var(--ink);border-radius:26px;padding:22px 18px 18px;text-align:center;
  box-shadow:0 12px 0 rgba(0,0,0,.25);animation:cardIn .32s cubic-bezier(.2,1.5,.4,1)}
@keyframes cardIn{0%{transform:scale(.7);opacity:0}100%{transform:none;opacity:1}}
.card h2{margin:0 0 6px;font-weight:400;font-size:30px;line-height:1.15}
.card p{margin:6px 0 14px;font-size:17px;line-height:1.45;color:#6B5646}
.card .btn+.btn{margin-top:10px}
.card .xbtn{position:absolute;right:10px;top:10px;width:40px;height:40px;border:0;border-radius:50%;background:rgba(0,0,0,.07);font-size:20px}
.card .fine{font-size:12px;color:var(--soft);margin:12px 0 0}
.card .fine a{color:var(--soft)}
.pass .who{font-size:52px;line-height:1.05;color:var(--pink2);margin:8px 0 2px;word-break:keep-all}
.pass .phone{font-size:54px;display:block;animation:phone 1.2s ease-in-out infinite}
@keyframes phone{50%{transform:translateX(16px) rotate(10deg)}}
.pen{background:linear-gradient(160deg,#FFF3C4,#FFE08A);border:4px solid var(--ink);animation:flip .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes flip{0%{transform:rotateY(90deg) scale(.6)}100%{transform:none}}
.pen .tag{display:inline-block;background:var(--pink);color:#fff;border-radius:999px;padding:4px 14px;font-size:16px}
.pen .ptxt{font-size:30px;line-height:1.3;margin:16px 4px 18px;color:var(--ink);word-break:keep-all}
.board{list-style:none;padding:0;margin:8px 0 14px;text-align:left}
.board li{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:8px 12px;margin-bottom:6px;font-size:18px}
.board li b{font-weight:400;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li span{font-size:15px;color:var(--soft)}
.board li em{font-style:normal;color:var(--pink2)}
.board li.king{background:#FFF0F5;box-shadow:0 0 0 2px var(--pink) inset}
.penList{list-style:none;padding:0;margin:6px 0 10px;text-align:left;max-height:40vh;overflow:auto}
.penList li{display:flex;gap:6px;align-items:center;background:#fff;border-radius:12px;padding:6px 6px 6px 12px;margin-bottom:6px;font-size:16px}
.penList li span{flex:1}
.penList li button{flex:none;width:36px;height:36px;border:0;border-radius:10px;background:#F5E9D6}
.penAdd{display:flex;gap:6px;margin-bottom:10px}
.penAdd input{flex:1;min-width:0;height:48px;border:2px solid #EADBC4;border-radius:14px;padding:0 12px;font:inherit;font-size:18px;background:#fff;color:var(--ink)}
.penAdd button{flex:none;width:72px;border:0;border-radius:14px;background:var(--mint);color:#fff;font-size:17px}
.setRow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px dashed #EADBC4;text-align:left;font-size:18px}
.setRow > span{flex:1}
.setRow.col{flex-direction:column;align-items:stretch}
.langs,.skins{display:flex;gap:6px;flex-wrap:wrap}
.langs button,.skins button{flex:1;min-width:72px;height:46px;border:0;border-radius:12px;background:#F2E5D0;font-size:15px;line-height:1.05;position:relative}
.langs button small{display:block;font-size:10px;opacity:.7}
.langs button.on,.skins button.on{background:var(--pink);color:#fff}
.skins button{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.skins button canvas{width:56px;height:34px}
.skins button.lock{opacity:.55}
.skins button.lock:after{content:'🔒';position:absolute;right:4px;top:2px;font-size:12px}
.setLink{display:block;margin-top:12px;font-size:13px;color:var(--soft)}
.tut{background:var(--cream)}
.tut .pic{font-size:72px;height:96px;display:flex;align-items:center;justify-content:center}
.tut .pic .f{display:inline-block;animation:swipe 1s ease-in-out infinite}
.tut .pic .h{display:inline-block;animation:beat .6s ease-in-out infinite}
@keyframes beat{30%{transform:scale(1.25)}}
.tut .bar{height:6px;border-radius:3px;background:#F0E2CB;overflow:hidden;margin:4px 0 12px}
.tut .bar i{display:block;height:100%;width:0;background:var(--pink)}
.tdots{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.tdots i{width:9px;height:9px;border-radius:50%;background:#EADBC4}.tdots i.on{background:var(--pink)}
.odds{font-size:14px;color:var(--soft);background:#fff;border-radius:12px;padding:8px 10px;text-align:left;line-height:1.5;margin:0 0 12px}
.res .score{font-size:64px;line-height:1;color:var(--pink2);margin:6px 0}
.res .best{display:inline-block;background:var(--yel);border-radius:999px;padding:3px 12px;font-size:15px}
.res .rline{min-height:22px;font-size:15px;color:var(--soft);margin:8px 0 12px}
#toast{position:fixed;left:50%;bottom:calc(var(--safeB) + 200px);transform:translate(-50%,20px);opacity:0;z-index:99;background:rgba(25,15,40,.92);color:#fff;
  padding:11px 18px;border-radius:16px;font-size:16px;transition:.22s;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>

<div id="app">
  <!-- 처음 화면 -->
  <section class="screen" id="scTitle">
    <div class="topRow">
      <button class="ibtn" id="tSet" data-ta="a_settings">⚙️</button>
      <div style="display:flex;gap:8px"><button class="ibtn" id="tHelp" data-ta="a_help">❓</button><button class="ibtn" id="tRank" data-ta="a_rank">🏆</button></div>
    </div>
    <div class="logo"><small data-t="brand"></small><b id="logoB"></b></div>
    <div class="heroBox"><div class="balloons" id="tBal"></div><img id="tKim" alt=""></div>
    <div class="menu">
      <button class="btn pri big" id="tParty"><span>🎉</span><span class="col"><span data-t="m_party"></span><small data-t="m_party_s"></small></span></button>

<script>
'use strict';
/* 김고양씨 빵! 룰렛 — 규칙 계산(화면과 따로). game.html 의 LOGIC 자리에 들어가고, node 로도 시험할 수 있다.
   실린더: 칸 6개. load[i] = 폭죽알이 들어 있는지, fired[i] = 이번 돌리기 뒤로 이미 당긴 칸, pos = 공이(망치) 앞 칸.
   '돌리기' = 남은 폭죽알을 6칸에 새로 무작위로 넣고(당긴 칸 기록도 지움) 시작 칸도 무작위.
   그래서 화면에 보이는 확률(남은 알 ÷ 아직 안 당긴 칸)은 언제나 정확한 값이다. 손가락으로 돌린 세기는 결과에 영향이 없다(조작 불가). */
var Logic = (function () {
  'use strict';
  const N = 6;
  const C = (typeof crypto !== 'undefined' && crypto.getRandomValues) ? crypto : null;
  /* 0 ~ n-1 고른 정수(암호용 난수, 나머지 치우침 없게 버리고 다시 뽑기) */
  function rnd(n) {
    if (!C) return Math.floor(Math.random() * n);
    const lim = Math.floor(0x100000000 / n) * n, a = new Uint32Array(1);
    do { C.getRandomValues(a); } while (a[0] >= lim);
    return a[0] % n;
  }
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function cyl(bullets) { const c = { load: Array(N).fill(false), fired: Array(N).fill(false), pos: 0, left: bullets | 0 }; spin(c); return c; }
  function spin(c) {
    const idx = shuffle([0, 1, 2, 3, 4, 5]);
    c.load = Array(N).fill(false); for (let i = 0; i < c.left; i++) c.load[idx[i]] = true;
    c.fired = Array(N).fill(false);
    c.pos = rnd(N);
    return c;
  }
  const unfired = c => c.fired.filter(x => !x).length;
  /* 다음 한 발이 '빵'일 확률 [분자, 분모] */
  function odds(c) { const n = unfired(c); return [Math.min(c.left, n), n]; }
  const peek = c => !!c.load[c.pos];
  /* 방아쇠: {hit} 돌려주고 다음 칸으로. 쿠션이면 빵이어도 폭죽알만 빠지고 hit=false, saved=true */
  function pull(c, cushion) {
    const hit = !!c.load[c.pos];
    c.fired[c.pos] = true;
    if (hit) { c.load[c.pos] = false; c.left--; }
    c.pos = (c.pos + 1) % N;
    // 다음 칸이 이미 당긴 칸이면(돌리기 없이 6발 다 쏜 경우) 그대로 둔다 — 실제로는 판이 끝나 새로 장전
    return { hit: hit && !cushion, saved: hit && !!cushion };
  }

  /* ---------- 혼자 모드 점수 ----------
     단계 s(1~5) = 폭죽알 s개로 시작. 안 당긴 칸이 남은 폭죽알 수와 같아지면(남은 칸이 전부 폭죽) 단계 통과.
     한 발 성공 점수 = 100 × p ÷ (1 − p) (p = 그 순간 빵 확률) → 위험할수록 많이. 단계 통과 보너스 = 100 × s.
     빵 → 모은 점수 0. '그만두기' → 모은 점수를 챙겨 랭킹에. 5단계를 다 넘기면 자동으로 챙김. */
  const STAGES = 5, ITEM_CAP = 3;
  function pts(c) { const [b, n] = odds(c); if (n <= 0 || b >= n) return 0; const p = b / n; return Math.round(100 * p / (1 - p)); }
  const cleared = c => unfired(c) === c.left;
  function solo() { return { stage: 1, c: cyl(1), pot: 0, pulls: 0, items: 0, done: false, hit: false }; }
  /* 한 발 당기기. 돌려줌 {hit, saved, gain, stageUp, bonus, done} */
  function soloPull(S, cushion) {
    const gain = pts(S.c);
    const r = pull(S.c, cushion);
    const out = { hit: r.hit, saved: r.saved, gain: 0, stageUp: false, bonus: 0, done: false };
    if (r.hit) { S.hit = true; S.done = true; S.pot = 0; out.done = true; return out; }
    S.pulls++;
    if (!r.saved) { S.pot += gain; out.gain = gain; }
    if (cleared(S.c)) {
      out.bonus = 100 * S.stage; S.pot += out.bonus; out.stageUp = true;
      if (S.stage >= STAGES) { S.done = true; out.done = true; }
      else { S.stage++; S.c = cyl(S.stage); }
    }
    return out;
  }
  /* 아이템 없이 낼 수 있는 최고 점수(서버 검사용) */
  function maxPure() {
    let t = 0;
    for (let s = 1; s <= STAGES; s++) { for (let k = 0; k < N - s; k++) { const p = s / (N - k); t += Math.round(100 * p / (1 - p)); } t += 100 * s; }
    return t;
  }
  return { N, rnd, shuffle, cyl, spin, odds, peek, pull, unfired, pts, cleared, solo, soloPull, maxPure, STAGES, ITEM_CAP };

function modal(html, soft){ const m = $('modal'); m.innerHTML = html; m.hidden = false; if (soft) m.dataset.soft = 1; else delete m.dataset.soft; m.classList.toggle('light', !!(SPL && sp.classList.contains('on'))); return m; }
function closeModal(){ $('modal').hidden = true; $('modal').innerHTML = ''; }
$('modal').addEventListener('click', e => { if (e.target.id === 'modal' && $('modal').dataset.soft) closeModal(); });
document.addEventListener('click', e => { if (e.target.closest('button')) sfx.ui(); }, true);

/* ---------- 그리기(캔버스) ---------- */
const cv = $('cv'), g = cv.getContext('2d');
let W = 360, H = 400, DPR = 1, BG = null;
const SEG = Math.PI / 3, TAU = Math.PI * 2;
const INK = '#3B2A20';
const SKINS = {
  toy:     { body: '#FF7FA3', barrel: '#FF9DB8', cyl: '#FFD166', grip: '#6FB8FF', tip: '#FF8C42', deco: 'dots' },
  cat:     { body: '#FFFFFF', barrel: '#F4F4F4', cyl: '#FFB3C7', grip: '#2E2E2E', tip: '#FF8C42', deco: 'paw' },
  gold:    { body: '#F5C542', barrel: '#FFE07A', cyl: '#D9A21B', grip: '#8B5A2B', tip: '#FF8C42', deco: 'shine' },
  rainbow: { body: '#B39DFF', barrel: '#7FDBFF', cyl: '#FFD166', grip: '#3CCB9A', tip: '#FF8C42', deco: 'rainbow' },
  space:   { body: '#3D3B8E', barrel: '#5D5FEF', cyl: '#9F7AEA', grip: '#1E1B4B', tip: '#FF8C42', deco: 'stars' },
};
const SKIN_ORDER = ['toy', 'cat', 'gold', 'rainbow', 'space'];
const PACK_ORDER = ['basic', 'toy', '8bit'];
const BAL_COL = ['#FF5C8A', '#FFD166', '#6FB8FF', '#3CCB9A', '#B39DFF', '#FF8C42'];
const CONF = ['#FF5C8A', '#FFD166', '#6FB8FF', '#3CCB9A', '#B39DFF', '#FF8C42', '#FFFFFF'];
const V = {
  t: 0, shake: 0, zoom: 1, vig: 0, beatK: 0,
  gun: { x: 0, y: 0, ang: -.4, sc: 1, cock: 0, trig: 0, flag: 0, flagV: 0, flagTo: 0, recoil: 0, len: 100 },
  bal: { x: 0, y: 0, r: 40, s: 1, wob: 0, popped: false, col: 0, inflate: 1, cush: 0, cushTo: 0 },
  big: { x: 0, y: 0, R: 80, vis: 0, visTo: 0, show: 0, showTo: 0, vload: [], drag: null, w: 0, spinning: false, settle: false, onStop: null, moved: 0, lastSeg: 0 },
  rot: 0, rotTo: null, jig: 0,
  mini: { x: 0, y: 0, R: 30, peek: 0, peekHit: false },
  parts: [],
};
function resize(){
  const r = $('stage').getBoundingClientRect(); if (!r.width) return;
  DPR = Math.min(2, window.devicePixelRatio || 1); W = r.width; H = r.height;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  BG = null; layout();
}
function layout(){
  const G = V.gun, B = V.bal;
  B.r = Math.min(W * .15, H * .13); B.x = W - B.r * 1.25; B.y = Math.max(B.r * 1.3 + 40, H * .36);
  G.sc = Math.min(W * .66 / 240, H * .48 / 200); G.x = W * .3; G.y = Math.min(H * .66, H - 112 * G.sc - 8);
  G.ang = Math.atan2(B.y - G.y, B.x - G.x);
  const d = Math.hypot(B.x - G.x, B.y - G.y);
  G.len = Math.max(20, (d - B.r * .55) / G.sc - 142);   // 깃발 막대 길이(풍선에 콕)
  V.big.R = Math.min(W * .3, H * .27); V.big.x = W / 2; V.big.y = H * .48;
  V.mini.R = Math.min(30, W * .08); V.mini.x = V.mini.R + 14; V.mini.y = V.mini.R + 40;
}
addEventListener('resize', () => { if (SCREEN === 'scPlay') resize(); });

function makeBG(){
  const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; const x = c.getContext('2d');
  x.scale(DPR, DPR);
  const gr = x.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#46327A'); gr.addColorStop(1, '#241840');
  x.fillStyle = gr; x.fillRect(0, 0, W, H);
  // 조명
  for (const [px, col] of [[.2, 'rgba(255,92,138,.18)'], [.8, 'rgba(111,184,255,.16)'], [.5, 'rgba(255,209,102,.12)']]){
    const rg = x.createRadialGradient(W * px, 0, 0, W * px, 0, H * .8); rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = rg; x.fillRect(0, 0, W, H);
  }
  // 바닥(파티 테이블)
  x.fillStyle = '#1C1233'; x.beginPath(); x.ellipse(W / 2, H * .93, W * .7, H * .16, 0, 0, TAU); x.fill();
  x.fillStyle = 'rgba(255,255,255,.05)'; x.beginPath(); x.ellipse(W / 2, H * .9, W * .5, H * .08, 0, 0, TAU); x.fill();
  // 깃발 줄
  const y0 = 18, sag = 22, n = 11;
  x.strokeStyle = 'rgba(255,255,255,.55)'; x.lineWidth = 1.5; x.beginPath(); x.moveTo(-5, y0); x.quadraticCurveTo(W / 2, y0 + sag * 2, W + 5, y0); x.stroke();
  for (let i = 0; i < n; i++){
    const k = (i + .5) / n, px = k * W, py = y0 + sag * 2 * 2 * k * (1 - k);
    x.fillStyle = CONF[i % 6]; x.beginPath(); x.moveTo(px - 11, py); x.lineTo(px + 11, py); x.lineTo(px, py + 20); x.closePath(); x.fill();
  }
  // 반짝이 점
  for (let i = 0; i < 40; i++){ x.fillStyle = `rgba(255,255,255,${.05 + Math.random() * .12})`; x.beginPath(); x.arc(Math.random() * W, 40 + Math.random() * H * .6, Math.random() * 2 + .5, 0, TAU); x.fill(); }
  return c;
}
function rr(x, X, Y, w, h, r){ x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }
function paw(x, X, Y, s, col){ x.fillStyle = col; x.beginPath(); x.ellipse(X, Y + s * .25, s * .45, s * .38, 0, 0, TAU); x.fill();
  for (const [dx, dy] of [[-.42, -.28], [-.14, -.52], [.14, -.52], [.42, -.28]]){ x.beginPath(); x.arc(X + dx * s, Y + dy * s, s * .16, 0, TAU); x.fill(); } }
function star(x, X, Y, r, col){ x.fillStyle = col; x.beginPath(); for (let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * .45 : r; x.lineTo(X + Math.cos(a) * rr2, Y + Math.sin(a) * rr2); } x.closePath(); x.fill(); }

/* 장난감 파티 총(옆모습). 원점 = 실린더 가운데, +x = 총구 쪽. 공이(뒤)·방아쇠·깃발 움직임 */
function drawGun(x, sk, o){
  o = o || {}; const cock = o.cock || 0, trig = o.trig || 0, rot = o.rot || 0, flag = o.flag || 0, len = o.len || 100;
  x.lineJoin = 'round'; x.lineCap = 'round'; x.strokeStyle = INK; x.lineWidth = 6;
  // 손잡이
  x.fillStyle = sk.grip; x.beginPath(); x.moveTo(-60, 4); x.lineTo(-20, 12); x.quadraticCurveTo(-30, 60, -44, 98); x.quadraticCurveTo(-70, 112, -94, 98); x.quadraticCurveTo(-90, 50, -60, 4); x.closePath(); x.fill(); x.stroke();
  x.save(); x.clip();
  if (sk.deco === 'paw'){ paw(x, -60, 62, 18, '#FFB3C7'); }
  else if (sk.deco === 'dots'){ x.fillStyle = 'rgba(255,255,255,.55)'; for (const [a, b] of [[-66, 40], [-52, 64], [-74, 80], [-48, 88]]){ x.beginPath(); x.arc(a, b, 5, 0, TAU); x.fill(); } }
  else if (sk.deco === 'stars'){ star(x, -64, 50, 9, '#FFD166'); star(x, -52, 82, 6, '#fff'); }
  else { x.fillStyle = 'rgba(255,255,255,.25)'; x.fillRect(-90, 30, 70, 8); x.fillRect(-90, 60, 70, 8); }
  x.restore(); x.beginPath(); x.moveTo(-60, 4); x.lineTo(-20, 12); x.quadraticCurveTo(-30, 60, -44, 98); x.quadraticCurveTo(-70, 112, -94, 98); x.quadraticCurveTo(-90, 50, -60, 4); x.stroke();
  // 방아쇠 울
  x.lineWidth = 7; x.beginPath(); x.arc(-8, 22, 21, .05, Math.PI * .95); x.stroke(); x.lineWidth = 6;
  // 방아쇠
  x.save(); x.translate(-6, 14); x.rotate(trig * .55); x.fillStyle = sk.cyl; x.beginPath(); x.moveTo(-4, 0); x.quadraticCurveTo(6, 12, -2, 24); x.lineTo(-8, 22); x.quadraticCurveTo(-2, 12, -10, 2); x.closePath(); x.fill(); x.stroke(); x.restore();
  // 공이(망치)
  x.save(); x.translate(-54, -22); x.rotate(-cock * .75); x.fillStyle = sk.body; x.beginPath(); x.moveTo(4, 6); x.lineTo(-4, -20); x.quadraticCurveTo(-12, -30, -22, -24); x.lineTo(-10, -12); x.lineTo(-6, 10); x.closePath(); x.fill(); x.stroke(); x.restore();
  // 총열
  x.fillStyle = sk.barrel; rr(x, 22, -24, 100, 32, 10); x.fill(); x.stroke();
  x.save(); rr(x, 22, -24, 100, 32, 10); x.clip();
  if (sk.deco === 'rainbow'){ CONF.slice(0, 6).forEach((c, i) => { x.fillStyle = c; x.fillRect(22 + i * 17, -26, 17, 36); }); }
  else if (sk.deco === 'shine'){ x.fillStyle = 'rgba(255,255,255,.55)'; x.fillRect(22, -19, 100, 6); }
  else if (sk.deco === 'stars'){ star(x, 55, -8, 7, '#FFD166'); star(x, 98, -8, 6, '#fff'); }
  else { x.fillStyle = 'rgba(255,255,255,.35)'; x.fillRect(22, -19, 100, 5); }
  x.restore(); rr(x, 22, -24, 100, 32, 10); x.stroke();
  x.fillStyle = sk.body; rr(x, 26, -35, 92, 12, 5); x.fill(); x.stroke();
  x.fillStyle = sk.body; rr(x, 104, -46, 14, 13, 4); x.fill(); x.stroke();
  // 주황 장난감 마개(진짜 총이 아니라는 표시)
  x.fillStyle = sk.tip; rr(x, 118, -28, 24, 40, 8); x.fill(); x.stroke();
  // 몸통
  x.fillStyle = sk.body; rr(x, -68, -34, 100, 56, 18); x.fill(); x.stroke();
  if (sk.deco === 'paw') paw(x, -46, -6, 13, '#FFB3C7');
  // 실린더(옆) + 홈이 돌아가는 모습
  x.fillStyle = sk.cyl; rr(x, -32, -28, 58, 46, 14); x.fill(); x.stroke();
  x.save(); rr(x, -32, -28, 58, 46, 14); x.clip();
  const off = ((rot / SEG) % 1 + 1) % 1;
  x.strokeStyle = 'rgba(0,0,0,.25)'; x.lineWidth = 7;
  for (let i = -1; i < 3; i++){ const px = -32 + (i + off) * 29 + 4; x.beginPath(); x.moveTo(px, -22); x.lineTo(px, 12); x.stroke(); }
  x.fillStyle = 'rgba(255,255,255,.35)'; x.fillRect(-32, -24, 58, 6);
  x.restore();
  x.strokeStyle = INK; x.lineWidth = 6; rr(x, -32, -28, 58, 46, 14); x.stroke();
  // 빵! 깃발
  if (flag > .01){
    const L = len * flag, ex = 142 + L;
    x.lineWidth = 5; x.beginPath(); x.moveTo(140, -8); x.lineTo(ex, -9); x.stroke();
    x.fillStyle = '#fff'; x.beginPath(); x.arc(ex, -9, 5, 0, TAU); x.fill(); x.stroke();
    x.save(); x.translate(ex - 4, -9); x.rotate(-(o.ang || 0)); const s = clamp(flag * 1.4, 0, 1);
    x.scale(s, s);
    const fw = 92, fh = 58, wv = Math.sin(V.t * 14) * 3;
    x.fillStyle = '#FFF7EA'; x.beginPath(); x.moveTo(-fw / 2, 4); x.quadraticCurveTo(0, 4 + wv, fw / 2, 4); x.lineTo(fw / 2, 4 + fh); x.quadraticCurveTo(0, 4 + fh - wv, -fw / 2, 4 + fh); x.closePath(); x.fill(); x.lineWidth = 5; x.stroke();
    x.fillStyle = '#E0306A'; x.font = '44px Jua, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(t('bang_flag'), 0, 4 + fh / 2 + 2);
    x.restore();
  }
}
function drawBalloon(x){
  const B = V.bal; if (B.popped && B.inflate <= 0) return;
  const s = B.inflate * B.s * (1 + V.beatK * .05), bob = Math.sin(V.t * 1.7) * 5, sw = Math.sin(V.t * 1.3) * .06 + Math.sin(B.wob * 20) * B.wob * .5;
  const col = BAL_COL[B.col % BAL_COL.length];
  x.save(); x.translate(B.x, B.y + bob); x.rotate(sw); x.scale(s, s);
  const r = B.r;
  // 줄
  x.strokeStyle = 'rgba(255,255,255,.7)'; x.lineWidth = 2; x.beginPath(); x.moveTo(0, r * 1.2); x.bezierCurveTo(r * .3, r * 1.6, -r * .3, r * 2, r * .1, r * 2.5); x.stroke();
  // 몸통
  x.lineWidth = 5; x.strokeStyle = INK; x.fillStyle = col;
  x.beginPath(); x.ellipse(0, 0, r * .92, r * 1.08, 0, 0, TAU); x.fill(); x.stroke();
  x.fillStyle = 'rgba(255,255,255,.6)'; x.beginPath(); x.ellipse(-r * .35, -r * .42, r * .18, r * .3, -.5, 0, TAU); x.fill();
  x.fillStyle = 'rgba(255,255,255,.35)'; x.beginPath(); x.arc(-r * .1, -r * .78, r * .07, 0, TAU); x.fill();
  // 매듭
  x.fillStyle = col; x.beginPath(); x.moveTo(-r * .14, r * 1.2); x.lineTo(r * .14, r * 1.2); x.lineTo(0, r * 1.05); x.closePath(); x.fill(); x.stroke();
  // 김고양씨 얼굴 그림(작게)
  x.lineWidth = 3; x.fillStyle = 'rgba(0,0,0,.75)'; rr(x, -r * .46, -r * .1, r * .4, r * .2, r * .08); x.fill(); rr(x, r * .06, -r * .1, r * .4, r * .2, r * .08); x.fill();
  x.fillRect(-r * .1, -r * .06, r * .2, r * .05);
  x.fillStyle = '#FF9AB5'; x.beginPath(); x.ellipse(0, r * .22, r * .08, r * .06, 0, 0, TAU); x.fill();
  x.restore();
  // 쿠션
  if (B.cush > .01){
    x.save(); x.translate(B.x - B.r * .9, B.y + B.r * .4); x.rotate(-.5); x.scale(B.cush, B.cush);
    x.fillStyle = '#BFF5E2'; x.strokeStyle = INK; x.lineWidth = 5; rr(x, -B.r * .9, -B.r * .55, B.r * 1.8, B.r * 1.1, B.r * .45); x.fill(); x.stroke();
    x.fillStyle = INK; for (const dx of [-.4, 0, .4]){ x.beginPath(); x.arc(dx * B.r, 0, 3.5, 0, TAU); x.fill(); }
    x.restore();
  }
}
/* 실린더 앞모습(크게: 돌리기, 작게: 남은 칸 표시) */
function drawCyl(x, cxp, cyp, R, o){
  const sk = SKINS[M.skin] || SKINS.toy; o = o || {};
  x.save(); x.translate(cxp, cyp);
  x.lineWidth = Math.max(3, R * .07); x.strokeStyle = INK; x.lineJoin = 'round';
  // 몸통(가장자리 홈 6개)
  x.fillStyle = sk.cyl; x.beginPath(); x.arc(0, 0, R, 0, TAU); x.fill(); x.stroke();
  x.fillStyle = 'rgba(0,0,0,.22)';
  for (let i = 0; i < 6; i++){   // 칸 사이 홈
    const a = V.rot + i * SEG - Math.PI / 2 + SEG / 2;
    x.beginPath(); x.ellipse(Math.cos(a) * R * .86, Math.sin(a) * R * .86, R * .1, R * .06, a, 0, TAU); x.fill();
  }
  const gl = x.createRadialGradient(-R * .3, -R * .4, R * .1, 0, 0, R); gl.addColorStop(0, 'rgba(255,255,255,.45)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = gl; x.beginPath(); x.arc(0, 0, R * .95, 0, TAU); x.fill();
  // 칸
  const cy = o.cyl;
  for (let i = 0; i < 6; i++){
    const a = V.rot + i * SEG - Math.PI / 2, hx = Math.cos(a) * R * .56, hy = Math.sin(a) * R * .56, hr = R * .2;
    const top = o.topIdx === i;
    x.fillStyle = '#2A1D14'; x.beginPath(); x.arc(hx, hy, hr, 0, TAU); x.fill(); x.lineWidth = Math.max(2, R * .045); x.stroke();
    const showLoad = o.vload ? o.vload[i] : false;
    if (showLoad && o.show > .01){
      x.save(); x.globalAlpha = o.show; const c2 = CONF[i % 6];
      const g2 = x.createRadialGradient(hx - hr * .3, hy - hr * .3, hr * .1, hx, hy, hr * .9); g2.addColorStop(0, '#fff'); g2.addColorStop(.35, c2); g2.addColorStop(1, c2);
      x.fillStyle = g2; x.beginPath(); x.arc(hx, hy, hr * .78, 0, TAU); x.fill();
      x.fillStyle = 'rgba(255,255,255,.8)'; for (let k = 0; k < 3; k++){ const aa = k * 2.1 + i; x.fillRect(hx + Math.cos(aa) * hr * .4 - 1.5, hy + Math.sin(aa) * hr * .4 - 1.5, 3, 3); }
      x.restore();
    }
    if (cy && cy.fired[i]){ x.fillStyle = 'rgba(255,255,255,.28)'; x.beginPath(); x.arc(hx, hy, hr * .8, 0, TAU); x.fill();
      x.strokeStyle = 'rgba(255,255,255,.7)'; x.lineWidth = Math.max(1.5, R * .04); x.beginPath(); x.moveTo(hx - hr * .35, hy - hr * .35); x.lineTo(hx + hr * .35, hy + hr * .35); x.moveTo(hx + hr * .35, hy - hr * .35); x.lineTo(hx - hr * .35, hy + hr * .35); x.stroke(); x.strokeStyle = INK; }
    if (top && o.peek > .01){
      x.save(); x.globalAlpha = o.peek;
      if (o.peekHit){ x.fillStyle = '#FF5C8A'; x.beginPath(); x.arc(hx, hy, hr * .8, 0, TAU); x.fill(); x.fillStyle = '#fff'; x.font = `${hr * 1.1}px Jua, sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('!', hx, hy + 1); }
      else { x.fillStyle = '#3CCB9A'; x.beginPath(); x.arc(hx, hy, hr * .8, 0, TAU); x.fill(); x.strokeStyle = '#fff'; x.lineWidth = Math.max(2, R * .06); x.beginPath(); x.moveTo(hx - hr * .35, hy); x.lineTo(hx - hr * .05, hy + hr * .3); x.lineTo(hx + hr * .4, hy - hr * .3); x.stroke(); }
      x.restore();
    }
  }
  // 가운데 축
  x.strokeStyle = INK; x.lineWidth = Math.max(2, R * .05); x.fillStyle = sk.body; x.beginPath(); x.arc(0, 0, R * .16, 0, TAU); x.fill(); x.stroke();
  x.restore();
  // 공이 표시(맨 위 칸)
  if (o.marker){ x.fillStyle = '#FFD166'; x.strokeStyle = INK; x.lineWidth = Math.max(2, R * .05); const my = cyp - R - 4;
    x.beginPath(); x.moveTo(cxp - R * .16, my - R * .2); x.lineTo(cxp + R * .16, my - R * .2); x.lineTo(cxp, my + R * .04); x.closePath(); x.fill(); x.stroke(); }
}
const topIdx = () => ((Math.round(-V.rot / SEG) % 6) + 6) % 6;

function burst(x0, y0, n, power, cols){
  for (let i = 0; i < n; i++){
    const a = Math.random() * TAU, sp = power * (.35 + Math.random() * .75);
    V.parts.push({ x: x0, y: y0, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - power * .35, r: Math.random() * TAU, vr: (Math.random() - .5) * 18,
      w: 5 + Math.random() * 7, h: 3 + Math.random() * 5, c: (cols || CONF)[Logic.rnd((cols || CONF).length)], life: 2 + Math.random() * 1.2, k: Math.random() < .2 ? 'o' : 'r' });
  }
  if (V.parts.length > 260) V.parts.splice(0, V.parts.length - 260);
}
function draw(){
  const x = g; x.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!BG) BG = makeBG();
  x.clearRect(0, 0, W, H);
  const sh = V.shake > 0 ? V.shake : 0, sx = (Math.random() - .5) * sh * 22, sy = (Math.random() - .5) * sh * 22;
  x.save(); x.translate(W / 2 + sx, H / 2 + sy); x.scale(V.zoom, V.zoom); x.translate(-W / 2, -H / 2);
  x.drawImage(BG, 0, 0, W, H);
  drawBalloon(x);
  const G = V.gun, sk = SKINS[M.skin] || SKINS.toy;
  x.save(); x.translate(G.x, G.y); x.rotate(G.ang); x.scale(G.sc, G.sc); x.translate(-G.recoil * 16, 0);
  drawGun(x, sk, { cock: G.cock, trig: G.trig, rot: V.rot + V.jig, flag: G.flag, len: G.len, ang: G.ang });
  x.restore();
  // 꽃가루
  for (const p of V.parts){
    x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.globalAlpha = clamp(p.life, 0, 1); x.fillStyle = p.c;

  G.recoil = Math.max(0, G.recoil - dt * 4);
  // 깃발 용수철

  V.jig = lerp(V.jig, 0, Math.min(1, dt * 14));
  // 실린더 돌기(손가락으로 휙)

  if (V.parts.length && V.parts[0].life <= 0) V.parts = V.parts.filter(p => p.life > 0 && p.y < H + 40);
}

  const cxp = w * (.35 + Math.random() * .3), cyp = h * (.3 + Math.random() * .18), R = Math.min(w, h) * .3;
  const lobes = Array.from({ length: 16 }, () => .78 + Math.random() * .45);
  const drops = Array.from({ length: 12 }, () => { const a = Math.random() * TAU, r = R * (1.15 + Math.random() * .6); return [cxp + Math.cos(a) * r, cyp + Math.sin(a) * r, 5 + Math.random() * R * .12]; });

  const sprinkles = Array.from({ length: 22 }, () => [cxp + (Math.random() - .5) * R * 1.5, cyp + (Math.random() - .5) * R * 1.4, Math.random() * TAU, CONF[Logic.rnd(6)]]);

}

async function soloAfter(r){
  if (r.hit){ await sleep(FAST ? 10 : 200); soloResult(0, true); return; }
  resetGunFlag(); V.bal.cushTo = 0;
  if (r.gain){ toast(t('s_got', { n: r.gain }), 1200); sfx.coin(); }

    sfx.stage(); bigText(t('stage_big', { n: SO.done ? 5 : SO.stage - 1 }), 'stage'); burst(W / 2, H * .4, 80, 480); vib([30, 40, 30]);
    toast(t('stage_bonus', { n: r.bonus }), 1800);

    if (SO.done){ soloResult(SO.pot, false, true); return; }
    CY = SO.c; newBalloon(); loadPhase(SO.stage, () => soloAim()); return;

  soloAim();

/* 혼자 모드 결과: 기록은 이 기기에만(최근 + 상위 기록 목록). 아이템 쓴 판은 따로 */
function addRec(score, items){
  const r = { s: score, i: items ? 1 : 0, d: Date.now(), k: SO.pulls, st: SO.stage };
  M.recs.push(r); M.recs.sort((a, b) => b.s - a.s || a.d - b.d);
  const keep = [], cnt = { 0: 0, 1: 0 };
  for (const x of M.recs) if (cnt[x.i]++ < 20) keep.push(x);
  M.recs = keep; save();
  const same = M.recs.filter(x => x.i === r.i), at = same.indexOf(r);
  return at >= 0 ? at + 1 : 0;
}
function soloResult(score, hit, all){
  PH = 'idle'; ui();
  const items = SO.items > 0, key = items ? 'bestI' : 'best';
  const isBest = score > 0 && score > (M[key] | 0);
  if (isBest){ M[key] = score; save(); }
  const place = score > 0 ? addRec(score, items) : 0;
  modal(`<div class="card res"><h2>${hit ? t('r_hit') : all ? t('r_all') : t('r_bank')}</h2>
    <div class="score">${score}<small style="font-size:24px">${t('pt')}</small></div>
    ${isBest ? `<span class="best">🏆 ${t('r_best')}</span>` : `<span class="best" style="background:#F2E5D0">${t('best')} ${M[key]}</span>`}
    <p style="margin:10px 0 0;font-size:15px">${hit ? t('r_hit_p', { n: SO.pulls }) : t('r_p', { n: SO.pulls, s: SO.stage })}${items ? '<br>' + t('r_items') : ''}</p>
    <div class="rline" id="rLine">${place ? t('r_place', { n: place }) : ''}</div>
    <button class="btn pri" id="rAgain">${t('again')}</button><button class="btn" id="rRank">🏆 ${t('rk_title')}</button><button class="btn" id="rHome">${t('to_home')}</button></div>`);

  $('rRank').onclick = () => { closeModal(); openRank(items ? 'I' : 'P'); };
  $('rHome').onclick = () => { closeModal(); goTitle(); };
}

let tutT = null;
function openTut(){
  const steps = t('tut'), pics = ['<span class="f">👆</span>🎡', '<span class="h">💓</span>👉🔘', '😺 ' + '<b style="font-size:40px">' + t('click_big') + '</b> / 🎉<b style="font-size:40px;color:#E0306A">' + t('bang_big') + '</b>'];
  let i = 0, t0 = 0; const DUR = 3300;
  const draw2 = () => {
    modal(`<div class="card tut"><div class="tdots">${steps.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
      <div class="pic">${pics[i]}</div><h2 style="font-size:26px">${steps[i][0]}</h2><p>${steps[i][1]}</p>
      <div class="bar"><i id="tutBar"></i></div>
      <button class="btn pri" id="tutGo">${i < steps.length - 1 ? t('next') : t('tut_go')}</button><button class="btn ghost" id="tutSkip" style="background:transparent;color:var(--soft);height:40px;font-size:15px">${t('skip')}</button></div>`);
    t0 = performance.now();
    $('tutGo').onclick = () => next(); $('tutSkip').onclick = () => end();
  };
  const next = () => { i++; if (i >= steps.length) end(); else { draw2(); sfx.ui(); } };
  const end = () => { clearInterval(tutT); tutT = null; M.tut = true; save(); closeModal(); };
  clearInterval(tutT);
  tutT = setInterval(() => { const b = $('tutBar'); if (!b){ clearInterval(tutT); return; } const k = (performance.now() - t0) / DUR; b.style.width = Math.min(100, k * 100) + '%'; if (k >= 1) next(); }, 50);
  draw2();
}

/* ---------- 내 기록(혼자 모드, 이 기기에만 저장) ---------- */
let rkTab = 'P';
function openRank(tab){ if (tab) rkTab = tab; show('scRank'); renderRank(); }
const fmtDay = ms => { const d = new Date(ms); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const medal = r => `<span class="no ${r <= 3 ? 'm' + r : ''}">${r}</span>`;
function renderRank(){
  for (const b of $('rkTabs').children) b.classList.toggle('on', b.dataset.tab === rkTab);
  const list = M.recs.filter(x => x.i === (rkTab === 'I' ? 1 : 0)).slice(0, 20);
  $('rkSum').textContent = t('rk_sum', { a: rkTab === 'I' ? M.bestI : M.best, n: M.runs });
  $('rkList').innerHTML = list.length ? list.map((x, k) => `<li class="${k === 0 ? 'me' : ''}">${medal(k + 1)}<span class="nm">${fmtDay(x.d)}<small>${t('rk_row', { k: x.k, s: x.st })}</small></span><span class="sc">${x.s}<small>${t('pt')}</small></span></li>`).join('')
    : `<div class="rkMsg">🏆<br>${t('rk_empty')}</div>`;
  $('rkLinks').innerHTML = M.recs.length ? `<button data-act="clear">${t('rk_clear')}</button>` : '';
}
$('rkTabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; rkTab = b.dataset.tab; renderRank(); $('rkScroll').scrollTop = 0; });
$('rkLinks').addEventListener('click', e => {
  if (!e.target.closest('[data-act="clear"]')) return;
  modal(`<div class="card"><h2 style="font-size:26px">${t('clr_q')}</h2><p>${t('clr_p')}</p><button class="btn pri" id="dOk">${t('clr_ok')}</button><button class="btn" id="dNo">${t('cancel')}</button></div>`);
  $('dNo').onclick = closeModal;
  $('dOk').onclick = () => { M.recs = []; M.best = 0; M.bestI = 0; save(); closeModal(); renderRank(); toast(t('clr_done')); };
});
$('rkBack').onclick = () => goTitle();
$('rkPlay').onclick = () => startSolo();

/* ---------- 폰 뒤로 가기(브라우저·PWA): 창이 떠 있으면 닫기 ---------- */
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('modal').hidden){ const c = $('modal').querySelector('.xbtn, #dNo, #tutSkip, #peOk'); if (c) c.click(); else if (SCREEN !== 'scPlay') closeModal(); } });

/* ---------- 시작 ---------- */
applyStatic(); $('mcImg').src = A.mascot.token; goTitle();
if (!M.tut && !TEST) setTimeout(openTut, 500);

/* 자동 확인용(헤드리스) */
window.T = {
  get M(){ return M; }, get PH(){ return PH; }, get PT(){ return PT; }, get SO(){ return SO; }, get CY(){ return CY; }, V, Logic,
  title: goTitle, setup: openSetup, party: startParty, solo: startSolo, rank: openRank, settings: openSettings, tut: openTut, setLang,
  autoSpin(){ if (PH === 'spin') startSpin(24); },
  pull(){ if (PH === 'aim'){ startHold(); HOLD.t0 -= PULL_MS; } },
  // 시험용: 다음 칸을 빵/찰칵으로 맞춤(폭죽알 수는 그대로, 다른 안 쏜 칸과 자리만 바꿈)
  force(hit){
    if (!CY) return; const n = CY.pos; if (CY.load[n] === !!hit) return;
    const j = [0, 1, 2, 3, 4, 5].find(i => i !== n && !CY.fired[i] && CY.load[i] === !!hit);
    if (j != null){ CY.load[j] = !hit; CY.load[n] = !!hit; } else { CY.load[n] = !!hit; CY.left = CY.load.filter(Boolean).length; }
  },
  bank: soloBank, results: partyResults,
};
</script>

<script>if('serviceWorker' in navigator && location.protocol!=='file:') addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
